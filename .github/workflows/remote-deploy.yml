name: Remote Flutter Build & Deploy

on:
  repository_dispatch:
    types: [trigger-build, trigger-cf-deploy]

permissions:
  actions: write
  contents: write

jobs:

  # ─────────────────────────────────────────────────────────
  # GitHub Pages deployment job
  # Triggered by: repository_dispatch type "trigger-build"
  #
  # Required client_payload fields:
  #   source_repo   – owner/repo to check out (e.g. "zmsp/myapp")
  #   sha           – commit SHA (for status reporting)
  #   ref           – branch / tag / SHA to checkout
  #   target_repo   – owner/repo to deploy gh-pages to
  #   sub_url       – sub-path inside target repo's gh-pages (optional)
  #   base_href     – Flutter --base-href override (optional)
  #   site_url      – deployed URL used in commit status (optional)
  #   persist_run   – set to true to keep this run in Actions history (optional, default: false)
  # ─────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    if: github.event.action == 'trigger-build'
    steps:
      - name: Mask sensitive secrets
        # Masks GH_PAT and all identifying payload values so they are redacted
        # from every subsequent log line, UI summary, and annotation.
        run: |
          echo "::add-mask::${{ secrets.GH_PAT }}"
          echo "::add-mask::${{ github.event.client_payload.source_repo }}"
          echo "::add-mask::${{ github.event.client_payload.target_repo }}"

      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
          show-progress: false

      - name: Report Build Status (Pending)
        run: |
          gh api --method POST /repos/${{ github.event.client_payload.source_repo }}/statuses/${{ github.event.client_payload.sha }} \
            -f state='pending' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='Flutter build in progress...' \
            -f context='Remote Build Engine'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          # Cache key uses a hash of source_repo to avoid printing the repo name in logs
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}

      - name: Cache Build Artifacts
        uses: actions/cache@v5
        with:
          path: |
            .dart_tool/
            build/
          # Key uses source_repo + pubspec hash + SHA so caches are strictly isolated per repository
          key: build-${{ runner.os }}-${{ github.event.client_payload.source_repo }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}-${{ github.event.client_payload.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ github.event.client_payload.source_repo }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}-
            build-${{ runner.os }}-${{ github.event.client_payload.source_repo }}-

      - name: Build Web
        run: |
          REPO="${{ github.event.client_payload.target_repo }}"
          NAME=$(echo "$REPO" | cut -d'/' -f2)
          SUB_URL="${{ github.event.client_payload.sub_url }}"
          PAYLOAD_BASE_HREF="${{ github.event.client_payload.base_href }}"

          # Priority: 1. Manual base_href, 2. sub_url, 3. Repo Name (Standard GH Pages)
          if [ -n "$PAYLOAD_BASE_HREF" ]; then
            BASE_HREF="$PAYLOAD_BASE_HREF"
          elif [ -n "$SUB_URL" ]; then
            BASE_HREF="/$NAME/$SUB_URL"
          else
            BASE_HREF="/$NAME/"
          fi

          echo "Building for $BASE_HREF"
          flutter pub get 2>&1 | tail -1
          if grep -q "build_runner:" pubspec.yaml 2>/dev/null; then
            echo "Running build_runner..."
            dart run build_runner build --delete-conflicting-outputs 2>&1 | grep -E '^(✓|✗|Building|Compiling|Font|Warning|Error|Exception|\[INFO\])' || true
          fi
          flutter build web --release --base-href "$BASE_HREF" 2>&1 | grep -E '^(✓|✗|Building|Compiling|Font|Warning|Error|Exception)' || true

      - name: Deploy to Target Repo
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          token: ${{ secrets.GH_PAT }}
          branch: gh-pages
          folder: build/web
          repository-name: ${{ github.event.client_payload.target_repo }}
          target-folder: ${{ github.event.client_payload.sub_url }}
          commit-message: "Automated deploy [${{ github.event.client_payload.sha }}]"

      - name: Report Build Status (Final)
        if: always()
        run: |
          STATE="${{ job.status }}"
          # Map GitHub Action status to GitHub Commit Status
          case "$STATE" in
            "success") STATUS="success"; DESC="Build and deploy successful";;
            "failure") STATUS="failure"; DESC="Build or deploy failed";;
            "cancelled") STATUS="error"; DESC="Build was cancelled";;
            *) STATUS="error"; DESC="Build ended with unknown status";;
          esac

          # Generate the target URL for the deployed site
          REPO="${{ github.event.client_payload.target_repo }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          NAME=$(echo "$REPO" | cut -d'/' -f2)
          SUB_URL="${{ github.event.client_payload.sub_url }}"
          SITE_URL="${{ github.event.client_payload.site_url }}"

          if [ -n "$SITE_URL" ]; then
            DEPLOY_URL="$SITE_URL"
          elif [ -n "$SUB_URL" ]; then
            DEPLOY_URL="https://$OWNER.github.io/$NAME/$SUB_URL"
          else
            DEPLOY_URL="https://$OWNER.github.io/$NAME"
          fi

          # Use DEPLOY_URL for success, fallback to action logs for failure
          TARGET_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then
            TARGET_URL="$DEPLOY_URL"
          fi

          gh api --method POST /repos/${{ github.event.client_payload.source_repo }}/statuses/${{ github.event.client_payload.sha }} \
            -f state="$STATUS" \
            -f target_url="$TARGET_URL" \
            -f description="$DESC" \
            -f context='Remote Build Engine'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Auto-cleanup run
        # Deletes this run's logs and record by default.
        # Pass persist_run: true in client_payload to skip.
        if: always() && github.event.client_payload.persist_run != true
        run: |
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/logs 2>/dev/null || true
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/${{ github.run_id }} 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

  # ─────────────────────────────────────────────────────────
  # Cloudflare Pages deployment job
  # Triggered by: repository_dispatch type "trigger-cf-deploy"
  #
  # Required client_payload fields:
  #   source_repo   – owner/repo to check out (e.g. "zmsp/periodcycle")
  #   sha           – commit SHA (for status reporting)
  #   ref           – branch / tag / SHA to checkout
  #   project_name  – Cloudflare Pages project name (e.g. "periodcycle")
  #   branch        – branch label shown in Cloudflare dashboard (optional,
  #                   defaults to the dispatching ref name)
  #   base_href     – Flutter --base-href override (optional, defaults to "/")
  #   site_url      – deployed URL used in commit status (optional)
  #   persist_run   – set to true to keep this run in Actions history (optional, default: false)
  # ─────────────────────────────────────────────────────────
  cloudflare-deploy:
    runs-on: ubuntu-latest
    if: github.event.action == 'trigger-cf-deploy'
    steps:
      - name: Mask sensitive secrets
        # IMPORTANT: masks all secret values and identifying payload fields immediately
        # so they are redacted from ALL subsequent log lines, UI summaries, and annotations.
        run: |
          echo "::add-mask::${{ secrets.GH_PAT }}"
          echo "::add-mask::${{ secrets.CLOUDFLARE_API_TOKEN }}"
          echo "::add-mask::${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          echo "::add-mask::${{ github.event.client_payload.source_repo }}"
          echo "::add-mask::${{ github.event.client_payload.project_name }}"

      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.source_repo }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
          show-progress: false

      - name: Report Build Status (Pending)
        run: |
          gh api --method POST /repos/${{ github.event.client_payload.source_repo }}/statuses/${{ github.event.client_payload.sha }} \
            -f state='pending' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f description='Flutter build in progress (Cloudflare)...' \
            -f context='Remote Build Engine / Cloudflare'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache-key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}

      - name: Cache Build Artifacts
        uses: actions/cache@v5
        with:
          path: |
            .dart_tool/
            build/
          key: build-cf-${{ runner.os }}-${{ github.event.client_payload.source_repo }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}-${{ github.event.client_payload.sha }}
          restore-keys: |
            build-cf-${{ runner.os }}-${{ github.event.client_payload.source_repo }}-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}-
            build-cf-${{ runner.os }}-${{ github.event.client_payload.source_repo }}-

      - name: Build Flutter Web
        run: |
          PAYLOAD_BASE_HREF="${{ github.event.client_payload.base_href }}"
          BASE_HREF="${PAYLOAD_BASE_HREF:-/}"
          echo "Building with base-href: $BASE_HREF"
          flutter pub get 2>&1 | tail -1
          if grep -q "build_runner:" pubspec.yaml 2>/dev/null; then
            echo "Running build_runner..."
            dart run build_runner build --delete-conflicting-outputs 2>&1 | grep -E '^(✓|✗|Building|Compiling|Font|Warning|Error|Exception|\[INFO\])' || true
          fi
          flutter build web --release --base-href "$BASE_HREF" 2>&1 | grep -E '^(✓|✗|Building|Compiling|Font|Warning|Error|Exception)' || true

      - name: Verify Build Output
        run: |
          [ -d "build/web" ] || { echo "Error: build/web directory not found"; exit 1; }
          echo "Build output verified ($(ls build/web | wc -l | tr -d ' ') files)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to Cloudflare Pages
        # Secrets are scoped only to this step via env vars.
        # ::add-mask:: above ensures values never appear in any log.
        id: cf_deploy
        run: |
          CF_BRANCH="${{ github.event.client_payload.branch }}"
          DEPLOY_BRANCH="${CF_BRANCH:-${{ github.ref_name }}}"
          DEPLOY_OUTPUT=$(npx --yes wrangler pages deploy build/web \
            --project-name="${{ github.event.client_payload.project_name }}" \
            --branch="$DEPLOY_BRANCH" 2>&1)
          echo "$DEPLOY_OUTPUT" | grep -E '(Deploying|Success|Error|✓|✗|https://)' || true
          
          # Extract deployed URL from Wrangler output (looks for https://...pages.dev)
          DEPLOYED_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -n 1)
          if [ -n "$DEPLOYED_URL" ]; then
            echo "cf_url=$DEPLOYED_URL" >> $GITHUB_OUTPUT
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false

      - name: Report Build Status (Final)
        if: always()
        run: |
          STATE="${{ job.status }}"
          case "$STATE" in
            "success") STATUS="success"; DESC="Build and Cloudflare deploy successful";;
            "failure") STATUS="failure"; DESC="Build or Cloudflare deploy failed";;
            "cancelled") STATUS="error"; DESC="Cloudflare build was cancelled";;
            *) STATUS="error"; DESC="Build ended with unknown status";;
          esac

          CF_DEPLOYED_URL="${{ steps.cf_deploy.outputs.cf_url }}"
          SITE_URL="${{ github.event.client_payload.site_url }}"
          PROJECT="${{ github.event.client_payload.project_name }}"
          
          # Priority: 1. Wrangler versioned/deployment URL output, 2. Explicit payload site_url, 3. Project fallback URL
          if [ -n "$CF_DEPLOYED_URL" ]; then
            DEPLOY_URL="$CF_DEPLOYED_URL"
          elif [ -n "$SITE_URL" ]; then
            DEPLOY_URL="$SITE_URL"
          else
            DEPLOY_URL="https://$PROJECT.pages.dev"
          fi

          TARGET_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$STATUS" = "success" ]; then
            TARGET_URL="$DEPLOY_URL"
          fi

          gh api --method POST /repos/${{ github.event.client_payload.source_repo }}/statuses/${{ github.event.client_payload.sha }} \
            -f state="$STATUS" \
            -f target_url="$TARGET_URL" \
            -f description="$DESC" \
            -f context='Remote Build Engine / Cloudflare'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Auto-cleanup run
        # Deletes this run's logs and record by default.
        # Pass persist_run: true in client_payload to skip.
        if: always() && github.event.client_payload.persist_run != true
        run: |
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/logs 2>/dev/null || true
          gh api --method DELETE /repos/${{ github.repository }}/actions/runs/${{ github.run_id }} 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
